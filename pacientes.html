<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conexão Psi — Área Restrita</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0F0D1A; --cream: #FAF7F2; --warm: #F2EDE4; --card: #FFFFFF;
  --plum: #2D1B4E; --violet: #5B3FA0; --lilac: #C4B5E8;
  --gold: #C8934A; --gold-light: #E8C98A; --sage: #3D7A5E;
  --muted: #7A7490; --border: #E8E2D8;
  --status-green: #3D7A5E; --status-orange: #B85C1A;
  --status-blue: #2A5FAC; --status-purple: #5B3FA0; --status-grey: #6B6480;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}

/* ── LOGIN ───────────────────────────── */
#login-screen {
  min-height: 100svh;
  background: var(--plum);
  display: flex; align-items: center; justify-content: center;
  padding: 2rem; position: relative; overflow: hidden;
}
#login-screen::before {
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 80% 20%, rgba(91,63,160,0.5) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 10% 80%, rgba(200,147,74,0.2) 0%, transparent 50%);
}
#login-screen::after {
  content:''; position:absolute; inset:0; opacity:0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px;
}
.login-box {
  position: relative; z-index: 2;
  width: 100%; max-width: 400px; text-align: center;
}
.login-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.8rem; font-weight: 700; color: #fff;
  letter-spacing: 0.01em; margin-bottom: 0.2rem;
}
.login-brand em { color: var(--gold-light); font-style: italic; }
.login-tagline {
  font-size: 0.68rem; letter-spacing: 2.5px; text-transform: uppercase;
  color: rgba(255,255,255,0.35); margin-bottom: 2.5rem;
}
.login-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 2rem;
}
.login-card h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.3rem; color: #fff; margin-bottom: 0.4rem;
}
.login-card p { font-size: 0.8rem; color: rgba(255,255,255,0.45); margin-bottom: 1.5rem; }
.login-input {
  width: 100%; padding: 0.85rem 1rem;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px; color: #fff;
  font-family: 'Outfit', sans-serif; font-size: 0.95rem;
  margin-bottom: 0.8rem; outline: none;
  transition: border-color 0.2s;
}
.login-input:focus { border-color: var(--gold); }
.login-input::placeholder { color: rgba(255,255,255,0.3); }
.btn-enter-login {
  width: 100%; padding: 0.85rem;
  background: var(--gold); color: var(--ink);
  border: none; border-radius: 10px;
  font-family: 'Outfit', sans-serif; font-size: 0.95rem; font-weight: 600;
  cursor: pointer; transition: opacity 0.2s;
}
.btn-enter-login:hover { opacity: 0.88; }
.login-error { color: #ff8a80; font-size: 0.8rem; margin-top: 0.6rem; min-height: 1.2rem; }

/* ── APP ─────────────────────────────── */
#app { display: none; }

.app-header {
  background: var(--plum);
  padding: 1rem 2rem;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 0.8rem;
  position: sticky; top: 0; z-index: 50;
  box-shadow: 0 2px 20px rgba(15,13,26,0.3);
}
.app-brand {
  display: flex; flex-direction: column; gap: 0;
}
.app-brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem; font-weight: 700; color: #fff; line-height: 1;
}
.app-brand-name em { color: var(--gold-light); font-style: italic; }
.app-brand-tag {
  font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(255,255,255,0.35);
}
.app-right { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
.perfil-chip {
  font-size: 0.72rem; color: var(--gold-light);
  background: rgba(200,147,74,0.15);
  border: 1px solid rgba(200,147,74,0.25);
  border-radius: 999px; padding: 4px 12px;
}
.btn-sair {
  padding: 0.4rem 1rem; background: transparent;
  border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6);
  border-radius: 8px; font-size: 0.77rem; cursor: pointer;
  font-family: 'Outfit', sans-serif; transition: all 0.2s;
}
.btn-sair:hover { border-color: rgba(255,255,255,0.4); color: #fff; }

/* ── TABS ────────────────────────────── */
.tabs-wrap {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 0 1.5rem; display: flex; gap: 0; overflow-x: auto;
}
.tab {
  padding: 1rem 1.2rem; font-size: 0.82rem; font-weight: 500;
  color: var(--muted); cursor: pointer; border: none; background: none;
  border-bottom: 2px solid transparent; white-space: nowrap;
  font-family: 'Outfit', sans-serif; transition: all 0.18s;
}
.tab.active { color: var(--plum); border-bottom-color: var(--violet); }
.tab:hover:not(.active) { color: var(--ink); }
.tab-badge {
  display: inline-block; background: var(--violet); color: #fff;
  font-size: 0.65rem; padding: 1px 6px; border-radius: 999px; margin-left: 5px;
}

/* ── CONTENT ─────────────────────────── */
.content { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

/* ── ADD FORM (admin) ────────────────── */
.add-form {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; padding: 1.5rem; margin-bottom: 2rem;
  border-top: 3px solid var(--gold);
}
.add-form h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem; color: var(--plum); margin-bottom: 1rem;
}
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid input, .form-grid select, .form-grid textarea {
  padding: 0.6rem 0.9rem; border: 1.5px solid var(--border);
  border-radius: 9px; font-family: 'Outfit', sans-serif;
  font-size: 0.83rem; color: var(--ink); background: var(--cream); outline: none;
}
.form-grid input:focus, .form-grid select:focus { border-color: var(--violet); }
.fg-full { grid-column: span 2; }
.btn-add {
  margin-top: 0.8rem; padding: 0.65rem 1.5rem;
  background: var(--plum); color: #fff; border: none;
  border-radius: 10px; font-family: 'Outfit', sans-serif;
  font-size: 0.85rem; font-weight: 500; cursor: pointer;
  transition: background 0.18s;
}
.btn-add:hover { background: var(--violet); }

/* ── GRID ────────────────────────────── */
.pac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1rem; }

.pac-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; padding: 1.3rem;
  display: flex; flex-direction: column; gap: 0.7rem;
  animation: slideUp 0.3s ease both; position: relative; overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
}
.pac-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(15,13,26,0.09); }
@keyframes slideUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

.pac-header { display: flex; justify-content: space-between; align-items: center; }
.status-pill {
  font-size: 0.68rem; font-weight: 600; padding: 3px 10px;
  border-radius: 999px; letter-spacing: 0.3px;
}
.s-disponivel { background: #E3F4ED; color: var(--status-green); }
.s-reservado { background: #FEF3E8; color: var(--status-orange); }
.s-em_atendimento { background: #E3ECF8; color: var(--status-blue); }
.s-concluido { background: #F0EDF8; color: var(--status-purple); }
.s-declinou { background: #F0EFF4; color: var(--status-grey); }

.pac-info { font-size: 0.82rem; color: var(--ink); line-height: 1.85; }
.pac-info div { display: flex; align-items: flex-start; gap: 6px; }
.pac-crp { font-size: 0.7rem; color: var(--muted); }

.pac-actions { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.btn-interesse {
  width: 100%; padding: 0.55rem; background: var(--plum); color: #fff;
  border: none; border-radius: 9px; font-size: 0.8rem; cursor: pointer;
  font-family: 'Outfit', sans-serif; font-weight: 500; transition: background 0.15s;
}
.btn-interesse:hover { background: var(--violet); }
.btn-row { display: flex; gap: 6px; }
.btn-confirmar { flex: 1; padding: 0.5rem; background: var(--sage); color: #fff; border: none; border-radius: 8px; font-size: 0.77rem; cursor: pointer; font-family: 'Outfit', sans-serif; }
.btn-declinar { flex: 1; padding: 0.5rem; background: transparent; color: var(--muted); border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.77rem; cursor: pointer; font-family: 'Outfit', sans-serif; }
.btn-del { background: none; border: none; cursor: pointer; color: var(--border); font-size: 14px; transition: color 0.15s; }
.btn-del:hover { color: #c0392b; }

.empty-state { text-align: center; padding: 4rem 1rem; }
.empty-state p { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: var(--muted); margin-bottom: 0.5rem; }
.empty-state span { font-size: 0.85rem; color: var(--lilac); }
.loading-state { text-align: center; padding: 3rem; color: var(--muted); font-size: 0.9rem; }

@media(max-width: 500px) {
  .form-grid { grid-template-columns: 1fr; }
  .fg-full { grid-column: span 1; }
  .app-header { padding: 0.8rem 1rem; }
  .content { padding: 1.5rem 1rem; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-brand">Conexão <em>Psi</em></div>
    <div class="login-tagline">Rede Colaborativa de Psicólogos</div>
    <div class="login-card">
      <h2>Área Restrita</h2>
      <p>Exclusivo para psicólogos da rede e administradores</p>
      <input type="password" class="login-input" id="senha-input" placeholder="Digite sua senha" onkeydown="if(event.key==='Enter')entrar()">
      <button class="btn-enter-login" onclick="entrar()">Entrar →</button>
      <div class="login-error" id="login-erro"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="app-header">
    <div class="app-brand">
      <div class="app-brand-name">Conexão <em>Psi</em></div>
      <div class="app-brand-tag">Rede Colaborativa de Psicólogos</div>
    </div>
    <div class="app-right">
      <span class="perfil-chip" id="perfil-badge">—</span>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </header>

  <div class="tabs-wrap">
    <button class="tab active" onclick="mudarAba('disponivel',this)" id="tab-disponivel">
      🟢 Disponíveis <span class="tab-badge" id="badge-disponivel">0</span>
    </button>
    <button class="tab" onclick="mudarAba('reservado',this)" id="tab-reservado">
      🟡 Reservados <span class="tab-badge" id="badge-reservado">0</span>
    </button>
    <button class="tab" onclick="mudarAba('em_atendimento',this)" id="tab-em_atendimento">
      🔵 Em atendimento <span class="tab-badge" id="badge-em_atendimento">0</span>
    </button>
    <button class="tab" onclick="mudarAba('concluido',this)" id="tab-concluido">
      ✅ Concluídos <span class="tab-badge" id="badge-concluido">0</span>
    </button>
    <button class="tab" onclick="mudarAba('declinou',this)" id="tab-declinou">
      ⚫ Declinados <span class="tab-badge" id="badge-declinou">0</span>
    </button>
  </div>

  <div class="content">
    <!-- FORM ADMIN -->
    <div class="add-form" id="add-form" style="display:none;">
      <h3>➕ Cadastrar novo paciente</h3>
      <div class="form-grid">
        <input id="f-crp" type="text" placeholder="CRP do psi que indica (obrigatório)" class="fg-full">
        <input id="f-nome" type="text" placeholder="Nome / iniciais do paciente (opcional)" class="fg-full">
        <select id="f-publico">
          <option value="">Público...</option>
          <option>Adulto</option><option>Adolescente</option>
          <option>Criança</option><option>Casal</option><option>Idoso</option>
        </select>
        <input id="f-demanda" type="text" placeholder="Demanda (ex: ansiedade, luto...)">
        <select id="f-formato">
          <option value="">Formato...</option>
          <option>Online</option><option>Presencial</option><option>Ambos</option>
        </select>
        <input id="f-cidade" type="text" placeholder="Cidade/Estado">
        <input id="f-valor" type="text" placeholder="Valor aproximado (ex: R$ 80-120)">
        <input id="f-horario" type="text" placeholder="Disponibilidade (ex: noturno)">
        <input id="f-obs" type="text" placeholder="Observações (opcional)" class="fg-full">
      </div>
      <button class="btn-add" onclick="cadastrarPaciente()">Publicar paciente</button>
    </div>

    <div id="grid-pacientes" class="pac-grid"></div>
    <div id="empty-msg" class="empty-state" style="display:none;">
      <p>Nenhum paciente aqui ainda</p>
      <span>Os pacientes aparecerão quando forem cadastrados 💜</span>
    </div>
    <div id="loading-msg" class="loading-state">Carregando...</div>
  </div>
</div>

<script>
const ADMIN_PASS = 'conexaopsi2026';
const PSI_PASS = 'redepsi2026';
let perfil = null;
let abaAtiva = 'disponivel';

function getPacientes() { return JSON.parse(localStorage.getItem('cp_pacientes') || '[]'); }
function salvarPacientes(d) { localStorage.setItem('cp_pacientes', JSON.stringify(d)); }

// ── AUTH ──
function entrar() {
  const s = document.getElementById('senha-input').value.trim();
  if (s === ADMIN_PASS) { perfil = 'admin'; iniciarApp(); }
  else if (s === PSI_PASS) { perfil = 'psi'; iniciarApp(); }
  else { document.getElementById('login-erro').textContent = 'Senha incorreta. Tente novamente.'; }
}

function sair() {
  perfil = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('senha-input').value = '';
  document.getElementById('login-erro').textContent = '';
}

function iniciarApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('perfil-badge').textContent = perfil === 'admin' ? '⚙️ Admin' : '🧠 Psicólogo(a)';
  document.getElementById('add-form').style.display = perfil === 'admin' ? 'block' : 'none';
  carregarPacientes();
}

// ── TABS ──
function mudarAba(aba, btn) {
  abaAtiva = aba;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  carregarPacientes();
}

function atualizarBadges(pacs) {
  ['disponivel','reservado','em_atendimento','concluido','declinou'].forEach(s => {
    const el = document.getElementById('badge-' + s);
    if (el) el.textContent = pacs.filter(p => p.status === s).length;
  });
}

// ── RENDER ──
function carregarPacientes() {
  document.getElementById('loading-msg').style.display = 'none';
  const pacs = getPacientes();
  atualizarBadges(pacs);
  renderGrid(pacs);
}

const STATUS_LABELS = {
  disponivel: '🟢 Disponível', reservado: '🟡 Reservado',
  em_atendimento: '🔵 Em atendimento', concluido: '✅ Concluído', declinou: '⚫ Declinou'
};

function renderGrid(pacs) {
  const filtrados = pacs.filter(p => p.status === abaAtiva);
  const grid = document.getElementById('grid-pacientes');
  const empty = document.getElementById('empty-msg');
  if (!filtrados.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  grid.innerHTML = filtrados.map((p, i) => {
    const statusClass = 's-' + p.status;
    const statusLabel = STATUS_LABELS[p.status] || p.status;
    const delBtn = perfil === 'admin'
      ? `<button class="btn-del" onclick="excluir('${p.id}')">✕</button>` : '';

    let acoes = '';
    if (p.status === 'disponivel') {
      acoes = `<button class="btn-interesse" onclick="reservar('${p.id}')">Tenho interesse</button>`;
    } else if (p.status === 'reservado') {
      acoes = `<div class="btn-row">
        <button class="btn-confirmar" onclick="mudarStatus('${p.id}','em_atendimento')">✅ Confirmar match</button>
        <button class="btn-declinar" onclick="mudarStatus('${p.id}','declinou')">❌ Declinar</button>
      </div>`;
    } else if (p.status === 'em_atendimento') {
      acoes = `<div class="btn-row">
        <button class="btn-confirmar" onclick="concluir('${p.id}')">✅ Concluído</button>
        <button class="btn-declinar" onclick="mudarStatus('${p.id}','declinou')">Declinar</button>
      </div>`;
    } else if (p.status === 'declinou') {
      acoes = `<button class="btn-interesse" onclick="mudarStatus('${p.id}','disponivel')" style="background:var(--muted)">↩ Reabrir</button>`;
    }

    return `<div class="pac-card" style="animation-delay:${Math.min(i,10)*0.04}s">
      <div class="pac-header">
        <span class="status-pill ${statusClass}">${statusLabel}</span>
        ${delBtn}
      </div>
      <div class="pac-info">
        ${p.nome ? `<div>👤 <strong>${p.nome}</strong></div>` : ''}
        ${p.publico ? `<div>👥 ${p.publico}</div>` : ''}
        ${p.demanda ? `<div>🧠 ${p.demanda}</div>` : ''}
        ${p.formato ? `<div>📋 ${p.formato}</div>` : ''}
        ${p.cidade ? `<div>📍 ${p.cidade}</div>` : ''}
        ${p.valor ? `<div>💰 ${p.valor}</div>` : ''}
        ${p.horario ? `<div>🕐 ${p.horario}</div>` : ''}
        ${p.reservadoPor ? `<div style="color:var(--status-orange);font-size:0.77rem;">Reservado por: ${p.reservadoPor}</div>` : ''}
        ${p.valorFinal ? `<div style="color:var(--status-green);font-size:0.77rem;">Valor final: ${p.valorFinal}</div>` : ''}
      </div>
      ${p.crpIndicou ? `<div class="pac-crp">Indicado por CRP: ${p.crpIndicou}</div>` : ''}
      <div class="pac-actions">${acoes}</div>
    </div>`;
  }).join('');
}

// ── AÇÕES ──
function cadastrarPaciente() {
  const crp = document.getElementById('f-crp').value.trim();
  const dem = document.getElementById('f-demanda').value.trim();
  if (!crp) { alert('CRP do psicólogo é obrigatório.'); return; }
  if (!dem) { alert('Demanda é obrigatória.'); return; }
  const novo = {
    id: Date.now().toString(),
    crpIndicou: crp,
    nome: document.getElementById('f-nome').value.trim(),
    publico: document.getElementById('f-publico').value,
    demanda: dem,
    formato: document.getElementById('f-formato').value,
    cidade: document.getElementById('f-cidade').value.trim(),
    valor: document.getElementById('f-valor').value.trim(),
    horario: document.getElementById('f-horario').value.trim(),
    obs: document.getElementById('f-obs').value.trim(),
    status: 'disponivel',
    criadoEm: new Date().toLocaleDateString('pt-BR'),
    reservadoPor: '', valorFinal: ''
  };
  const pacs = getPacientes();
  pacs.unshift(novo);
  salvarPacientes(pacs);
  ['f-crp','f-nome','f-publico','f-demanda','f-formato','f-cidade','f-valor','f-horario','f-obs']
    .forEach(id => { document.getElementById(id).value = ''; });
  abaAtiva = 'disponivel';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-disponivel').classList.add('active');
  carregarPacientes();
}

function reservar(id) {
  const nome = prompt('Seu nome (para identificação):');
  if (!nome) return;
  const pacs = getPacientes();
  const p = pacs.find(x => x.id === id);
  if (p) {
    p.status = 'reservado'; p.reservadoPor = nome;
    salvarPacientes(pacs);
    abaAtiva = 'reservado';
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-reservado').classList.add('active');
    carregarPacientes();
  }
}

function mudarStatus(id, novoStatus) {
  const pacs = getPacientes();
  const p = pacs.find(x => x.id === id);
  if (p) {
    if (novoStatus === 'disponivel') { p.reservadoPor = ''; p.valorFinal = ''; }
    p.status = novoStatus;
    salvarPacientes(pacs);
    abaAtiva = novoStatus;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + novoStatus).classList.add('active');
    carregarPacientes();
  }
}

function concluir(id) {
  const valor = prompt('Valor da sessão fechado (ex: R$ 100):');
  const pacs = getPacientes();
  const p = pacs.find(x => x.id === id);
  if (p) {
    p.status = 'concluido'; p.valorFinal = valor || '';
    salvarPacientes(pacs);
    abaAtiva = 'concluido';
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-concluido').classList.add('active');
    carregarPacientes();
  }
}

function excluir(id) {
  if (!confirm('Excluir este paciente?')) return;
  salvarPacientes(getPacientes().filter(x => x.id !== id));
  carregarPacientes();
}
</script>
