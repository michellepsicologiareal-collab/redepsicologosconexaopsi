<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conexão Psi — Área Restrita</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F0D1A;--cream:#FAF7F2;--warm:#F2EDE4;--card:#FFFFFF;--plum:#2D1B4E;--violet:#5B3FA0;--gold:#C8934A;--gold-light:#E8C98A;--sage:#3D7A5E;--muted:#7A7490;--border:#E8E2D8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}

/* LOGIN */
#login-screen{min-height:100vh;background:var(--plum);display:flex;align-items:center;justify-content:center;padding:2rem;position:relative;overflow:hidden;}
#login-screen::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 80% 20%,rgba(91,63,160,0.5) 0%,transparent 60%),radial-gradient(ellipse 40% 40% at 10% 80%,rgba(200,147,74,0.2) 0%,transparent 50%);}
.lbox{position:relative;z-index:2;width:100%;max-width:400px;text-align:center;}
.lbrand{font-family:'Cormorant Garamond',serif;font-size:2.8rem;font-weight:700;color:#fff;margin-bottom:0.2rem;}
.lbrand em{color:var(--gold-light);font-style:italic;}
.ltag{font-size:0.68rem;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:2.5rem;}
.lcard{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:2rem;}
.lcard h2{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:#fff;margin-bottom:0.4rem;}
.lcard p{font-size:0.8rem;color:rgba(255,255,255,0.45);margin-bottom:1.5rem;}
.linput{width:100%;padding:0.85rem 1rem;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-family:'Outfit',sans-serif;font-size:0.95rem;margin-bottom:0.8rem;outline:none;transition:border-color 0.2s;}
.linput:focus{border-color:var(--gold);}
.linput::placeholder{color:rgba(255,255,255,0.3);}
.lblogin{width:100%;padding:0.85rem;background:var(--gold);color:var(--ink);border:none;border-radius:10px;font-family:'Outfit',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;transition:opacity 0.2s;}
.lblogin:hover{opacity:0.88;}
.lerr{color:#ff8a80;font-size:0.8rem;margin-top:0.6rem;min-height:1.2rem;}

/* APP */
#app{display:none;}
.aheader{background:var(--plum);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.8rem;position:sticky;top:0;z-index:50;box-shadow:0 2px 20px rgba(15,13,26,0.3);}
.abname{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:700;color:#fff;line-height:1;}
.abname em{color:var(--gold-light);font-style:italic;}
.abtag{font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.35);}
.pchip{font-size:0.72rem;color:var(--gold-light);background:rgba(200,147,74,0.15);border:1px solid rgba(200,147,74,0.25);border-radius:999px;padding:4px 12px;}
.bsair{padding:0.4rem 1rem;background:transparent;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);border-radius:8px;font-size:0.77rem;cursor:pointer;font-family:'Outfit',sans-serif;}
.bsair:hover{border-color:rgba(255,255,255,0.4);color:#fff;}

/* TABS */
.twrap{background:var(--card);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;overflow-x:auto;}
.tab{padding:1rem 1.2rem;font-size:0.82rem;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;font-family:'Outfit',sans-serif;transition:all 0.18s;}
.tab.active{color:var(--plum);border-bottom-color:var(--violet);}
.tbadge{display:inline-block;background:var(--violet);color:#fff;font-size:0.65rem;padding:1px 6px;border-radius:999px;margin-left:5px;}

.content{max-width:1100px;margin:0 auto;padding:2rem 1.5rem;}


.badd:disabled{opacity:0.6;cursor:not-allowed;}

/* CARDS */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem;}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.3rem;display:flex;flex-direction:column;gap:0.7rem;animation:su 0.3s ease both;transition:transform 0.2s,box-shadow 0.2s;position:relative;overflow:hidden;}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;opacity:0;transition:opacity 0.2s;}
.pcard:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(15,13,26,0.09);}
.pcard:hover::before{opacity:1;}
.s-disponivel::before{background:linear-gradient(90deg,var(--sage),#6db89a);}
.s-reservado::before{background:linear-gradient(90deg,var(--gold),var(--gold-light));}
.s-em_atendimento::before{background:linear-gradient(90deg,#2A5FAC,#6b9fe0);}
.s-concluido::before{background:linear-gradient(90deg,var(--violet),#9b75e0);}
.s-declinou::before{background:linear-gradient(90deg,var(--muted),#b0abc0);}
@keyframes su{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.phead{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;}
.status-select{font-size:0.72rem;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--cream);font-family:'Outfit',sans-serif;color:var(--ink);cursor:pointer;outline:none;}
.status-select:focus{border-color:var(--violet);}
.spill{font-size:0.68rem;font-weight:600;padding:3px 10px;border-radius:999px;}
.sp-disponivel{background:#E3F4ED;color:#3D7A5E;}
.sp-reservado{background:#FEF3E8;color:#B85C1A;}
.sp-em_atendimento{background:#E3ECF8;color:#2A5FAC;}
.sp-concluido{background:#F0EDF8;color:#5B3FA0;}
.sp-declinou{background:#F0EFF4;color:#6B6480;}
.sp-pendente{background:#FEF9EC;color:#B85C1A;}
.bdel{background:none;border:none;cursor:pointer;color:var(--border);font-size:14px;transition:color 0.15s;}
.bdel:hover{color:#c0392b;}
.pinfo{font-size:0.82rem;color:var(--ink);line-height:1.85;}
.pinfo div{display:flex;align-items:flex-start;gap:6px;}
.pcrp{font-size:0.7rem;color:var(--muted);}
.pact{margin-top:auto;display:flex;flex-direction:column;gap:6px;}
.bint{width:100%;padding:0.55rem;background:var(--plum);color:#fff;border:none;border-radius:9px;font-size:0.8rem;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:500;}
.bint:hover{background:var(--violet);}
.brow{display:flex;gap:6px;}
.bok{flex:1;padding:0.5rem;background:var(--sage);color:#fff;border:none;border-radius:8px;font-size:0.77rem;cursor:pointer;font-family:'Outfit',sans-serif;}
.bno{flex:1;padding:0.5rem;background:transparent;color:var(--muted);border:1.5px solid var(--border);border-radius:8px;font-size:0.77rem;cursor:pointer;font-family:'Outfit',sans-serif;}

.empty{text-align:center;padding:4rem 1rem;}
.empty p{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--muted);margin-bottom:0.5rem;}
.empty span{font-size:0.85rem;color:#C4B5E8;}
.loading{text-align:center;padding:3rem;color:var(--muted);}
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--plum);color:#fff;padding:0.8rem 1.4rem;border-radius:12px;font-size:0.85rem;z-index:999;animation:fadeIn 0.3s ease;box-shadow:0 8px 24px rgba(15,13,26,0.3);}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:500px){.aheader{padding:0.8rem 1rem;}.content{padding:1.5rem 1rem;}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="lbox">
    <div class="lbrand">Conexão <em>Psi</em></div>
    <div class="ltag">Rede Colaborativa de Psicólogos</div>
    <div class="lcard">
      <h2>Área Restrita</h2>
      <p>Exclusivo para psicólogos da rede e administradores</p>
      <input type="password" class="linput" id="senha" placeholder="Digite sua senha" onkeydown="if(event.key==='Enter')entrar()">
      <button class="lblogin" onclick="entrar()">Entrar →</button>
      <div class="lerr" id="lerr"></div>
    </div>
  </div>
</div>

<div id="app">
  <header class="aheader">
    <div>
      <div class="abname">Conexão <em>Psi</em></div>
      <div class="abtag">Rede Colaborativa de Psicólogos</div>
    </div>
    <div style="display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;">
      <span class="pchip" id="pbadge">—</span>
      <button class="bsair" onclick="sair()">Sair</button>
    </div>
  </header>

  <div class="twrap">
    <button class="tab active" onclick="mudarAba('disponivel',this)">🟢 Disponíveis <span class="tbadge" id="b-disponivel">0</span></button>
    <button class="tab" onclick="mudarAba('pendente',this)" id="tab-pendente" style="display:none;">⏳ Pendentes <span class="tbadge" style="background:#C8934A;" id="b-pendente">0</span></button>
    <button class="tab" onclick="mudarAba('reservado',this)">🟡 Reservados <span class="tbadge" id="b-reservado">0</span></button>
    <button class="tab" onclick="mudarAba('em_atendimento',this)">🔵 Em atendimento <span class="tbadge" id="b-em_atendimento">0</span></button>
    <button class="tab" onclick="mudarAba('concluido',this)">✅ Concluídos <span class="tbadge" id="b-concluido">0</span></button>
    <button class="tab" onclick="mudarAba('declinou',this)">⚫ Declinados <span class="tbadge" id="b-declinou">0</span></button>
  </div>

  <div class="content">
      <button class="badd" id="btn-add" onclick="cadastrar()">Publicar paciente</button>
    </div>
    <div id="grid" class="pgrid"></div>
    <div id="empty" class="empty" style="display:none;"><p>Nenhum paciente aqui ainda</p><span>Os pacientes aparecerão quando forem cadastrados 💜</span></div>
    <div id="loading" class="loading">Carregando...</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://tjtrdfbckgdgvcegdsbz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqdHJkZmJja2dkZ3ZjZWdkc2J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyODM1ODcsImV4cCI6MjA4OTg1OTU4N30.zNHugdW2a2hYrY43hdqS8TkSM9uCYognU_UyzJZ2Los';
const ADMIN_PASS = 'conexaopsi2026';
const PSI_PASS = 'redepsi2026';

let perfil = null;
let abaAtiva = 'disponivel';
let todosOsPacientes = [];

// ── SUPABASE API ──
async function sbGet(table, filters='') {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*${filters}&order=created_at.desc`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbInsert(table, data) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sbUpdate(table, id, data) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: 'PATCH',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(await res.text());
}

async function sbDelete(table, id) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: 'DELETE',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
  });
  if (!res.ok) throw new Error(await res.text());
}

// ── AUTH ──
function entrar() {
  const s = document.getElementById('senha').value.trim();
  if (s === ADMIN_PASS) { perfil = 'admin'; iniciar(); }
  else if (s === PSI_PASS) { perfil = 'psi'; iniciar(); }
  else { document.getElementById('lerr').textContent = 'Senha incorreta.'; }
}

function sair() {
  perfil = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('senha').value = '';
}

function iniciar() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('pbadge').textContent = perfil === 'admin' ? '⚙️ Admin' : '🧠 Psicólogo(a)';
  
  document.getElementById('tab-pendente').style.display = perfil === 'admin' ? 'flex' : 'none';
  carregar();
}

// ── TABS ──
function mudarAba(aba, btn) {
  abaAtiva = aba;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function atualizarBadges(pacs) {
  ['disponivel','pendente','reservado','em_atendimento','concluido','declinou'].forEach(s => {
    const el = document.getElementById('b-' + s);
    if (el) el.textContent = pacs.filter(p => p.status === s).length;
  });
}

// ── LOAD ──
async function carregar() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('grid').innerHTML = '';
  document.getElementById('empty').style.display = 'none';
  try {
    todosOsPacientes = await sbGet('pacientes');
    atualizarBadges(todosOsPacientes);
    render();
  } catch(e) {
    document.getElementById('loading').textContent = 'Erro ao carregar. Tente novamente.';
    console.error(e);
  }
  document.getElementById('loading').style.display = 'none';
}

// ── RENDER ──
const STATUS_LABELS = {
  pendente:'⏳ Pendente',
  disponivel:'🟢 Disponível', reservado:'🟡 Reservado',
  em_atendimento:'🔵 Em atendimento', concluido:'✅ Concluído', declinou:'⚫ Declinou'
};

function render() {
  const filtrados = todosOsPacientes.filter(p => p.status === abaAtiva);
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if (!filtrados.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  grid.innerHTML = filtrados.map((p, i) => {
    const sl = STATUS_LABELS[p.status] || p.status;
    const delBtn = perfil === 'admin'
      ? `<button class="bdel" onclick="excluir('${p.id}')">✕</button>` : '';

    // Admin gets dropdown, psi gets pill
    const statusEl = perfil === 'admin'
      ? `<select class="status-select" onchange="mudarStatus('${p.id}',this.value)">
          <option value="disponivel" ${p.status==='disponivel'?'selected':''}>🟢 Disponível</option>
          <option value="reservado" ${p.status==='reservado'?'selected':''}>🟡 Reservado</option>
          <option value="em_atendimento" ${p.status==='em_atendimento'?'selected':''}>🔵 Em atendimento</option>
          <option value="concluido" ${p.status==='concluido'?'selected':''}>✅ Concluído</option>
          <option value="declinou" ${p.status==='declinou'?'selected':''}>⚫ Declinou</option>
        </select>`
      : `<span class="spill sp-${p.status}">${sl}</span>`;

    let acoes = '';
    if (perfil === 'psi') {
      if (p.status === 'disponivel') {
        acoes = `<button class="bint" onclick="reservar('${p.id}')">Tenho interesse</button>`;
      } else if (p.status === 'reservado') {
        acoes = `<div class="brow">
          <button class="bok" onclick="mudarStatus('${p.id}','em_atendimento')">✅ Confirmar</button>
          <button class="bno" onclick="mudarStatus('${p.id}','declinou')">❌ Declinar</button>
        </div>`;
      } else if (p.status === 'em_atendimento') {
        acoes = `<div class="brow">
          <button class="bok" onclick="concluir('${p.id}')">✅ Concluído</button>
          <button class="bno" onclick="mudarStatus('${p.id}','declinou')">Declinar</button>
        </div>`;
      }
    }

    // Admin approve/reject for pendente
    let adminPendAcoes = '';
    if (perfil === 'admin' && p.status === 'pendente') {
      adminPendAcoes = `<div class="brow">
        <button class="bok" onclick="aprovarPaciente('${p.id}')">✅ Aprovar</button>
        <button class="bno" onclick="rejeitarPaciente('${p.id}')">❌ Rejeitar</button>
      </div>`;
    }

    return `<div class="pcard s-${p.status}" style="animation-delay:${Math.min(i,10)*0.04}s">
      <div class="phead">
        ${statusEl}
        ${delBtn}
      </div>
      <div class="pinfo">
        ${p.nome ? `<div>👤 <strong>${p.nome}</strong></div>` : ''}
        ${p.publico ? `<div>👥 ${p.publico}</div>` : ''}
        ${p.demanda ? `<div>🧠 ${p.demanda}</div>` : ''}
        ${p.formato ? `<div>📋 ${p.formato}</div>` : ''}
        ${p.cidade ? `<div>📍 ${p.cidade}</div>` : ''}
        ${p.valor ? `<div>💰 ${p.valor}</div>` : ''}
        ${p.horario ? `<div>🕐 ${p.horario}</div>` : ''}
        ${p.reservado_por ? `<div style="color:#B85C1A;font-size:0.77rem;">Reservado por: ${p.reservado_por}</div>` : ''}
        ${p.valor_final ? `<div style="color:#3D7A5E;font-size:0.77rem;">Valor final: ${p.valor_final}</div>` : ''}
      </div>
      ${p.crp_indicou ? `<div class="pcrp">Indicado por CRP: ${p.crp_indicou}</div>` : ''}
      ${acoes ? `<div class="pact">${acoes}</div>` : ''}
      ${adminPendAcoes ? `<div class="pact">${adminPendAcoes}</div>` : ''}
    </div>`;
  }).join('');
}

// ── AÇÕES ──


async function mudarStatus(id, novoStatus) {
  try {
    const data = { status: novoStatus };
    if (novoStatus === 'disponivel') { data.reservado_por = null; data.valor_final = null; }
    await sbUpdate('pacientes', id, data);
    const p = todosOsPacientes.find(x => x.id === id);
    if (p) Object.assign(p, data);
    atualizarBadges(todosOsPacientes);
    render();
  } catch(e) { alert('Erro: ' + e.message); }
}

async function reservar(id) {
  const nome = prompt('Seu nome (para identificação):');
  if (!nome) return;
  try {
    await sbUpdate('pacientes', id, { status: 'reservado', reservado_por: nome });
    const p = todosOsPacientes.find(x => x.id === id);
    if (p) { p.status = 'reservado'; p.reservado_por = nome; }
    atualizarBadges(todosOsPacientes);
    abaAtiva = 'reservado';
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab')[1].classList.add('active');
    render();
    showToast('🟡 Interesse registrado!');
  } catch(e) { alert('Erro: ' + e.message); }
}

async function concluir(id) {
  const valor = prompt('Valor da sessão fechado (ex: R$ 100):');
  try {
    await sbUpdate('pacientes', id, { status: 'concluido', valor_final: valor || '' });
    const p = todosOsPacientes.find(x => x.id === id);
    if (p) { p.status = 'concluido'; p.valor_final = valor || ''; }
    atualizarBadges(todosOsPacientes);
    render();
    showToast('✅ Encaminhamento concluído!');
  } catch(e) { alert('Erro: ' + e.message); }
}

async function excluir(id) {
  if (!confirm('Excluir este paciente?')) return;
  try {
    await sbDelete('pacientes', id);
    todosOsPacientes = todosOsPacientes.filter(x => x.id !== id);
    atualizarBadges(todosOsPacientes);
    render();
  } catch(e) { alert('Erro: ' + e.message); }
}

async function aprovarPaciente(id) {
  try {
    await sbUpdate('pacientes', id, { status: 'disponivel' });
    const p = todosOsPacientes.find(x => x.id === id);
    if (p) p.status = 'disponivel';
    atualizarBadges(todosOsPacientes);
    render();
    showToast('✅ Paciente aprovado e disponível!');
  } catch(e) { alert('Erro: ' + e.message); }
}

async function rejeitarPaciente(id) {
  if (!confirm('Rejeitar e excluir este cadastro?')) return;
  try {
    await sbDelete('pacientes', id);
    todosOsPacientes = todosOsPacientes.filter(x => x.id !== id);
    atualizarBadges(todosOsPacientes);
    render();
    showToast('❌ Cadastro rejeitado.');
  } catch(e) { alert('Erro: ' + e.message); }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>
