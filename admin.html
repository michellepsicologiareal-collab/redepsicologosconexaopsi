<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conexão Psi — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F0D1A;--cream:#FAF7F2;--warm:#F2EDE4;--card:#FFFFFF;--plum:#2D1B4E;--violet:#5B3FA0;--gold:#C8934A;--gold-light:#E8C98A;--sage:#3D7A5E;--muted:#7A7490;--border:#E8E2D8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}

#login{min-height:100vh;background:var(--plum);display:flex;align-items:center;justify-content:center;padding:2rem;position:relative;overflow:hidden;}
#login::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 80% 20%,rgba(91,63,160,0.5) 0%,transparent 60%),radial-gradient(ellipse 40% 40% at 10% 80%,rgba(200,147,74,0.2) 0%,transparent 50%);}
.lbox{position:relative;z-index:2;width:100%;max-width:400px;text-align:center;}
.lbrand{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;color:#fff;margin-bottom:0.2rem;}
.lbrand em{color:var(--gold-light);font-style:italic;}
.ltag{font-size:0.68rem;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:2rem;}
.lcard{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:2rem;}
.lcard h2{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:#fff;margin-bottom:0.4rem;}
.lcard p{font-size:0.8rem;color:rgba(255,255,255,0.45);margin-bottom:1.5rem;}
.linput{width:100%;padding:0.85rem 1rem;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#fff;font-family:'Outfit',sans-serif;font-size:0.95rem;margin-bottom:0.8rem;outline:none;}
.linput:focus{border-color:var(--gold);}
.linput::placeholder{color:rgba(255,255,255,0.3);}
.lblogin{width:100%;padding:0.85rem;background:var(--gold);color:var(--ink);border:none;border-radius:10px;font-family:'Outfit',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;}
.lerr{color:#ff8a80;font-size:0.8rem;margin-top:0.6rem;min-height:1.2rem;}

#app{display:none;}
.header{background:var(--plum);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.8rem;position:sticky;top:0;z-index:50;box-shadow:0 2px 20px rgba(15,13,26,0.3);}
.hbrand{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;color:#fff;}
.hbrand em{color:var(--gold-light);font-style:italic;}
.htag{font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.35);}
.chip{font-size:0.72rem;color:var(--gold-light);background:rgba(200,147,74,0.15);border:1px solid rgba(200,147,74,0.25);border-radius:999px;padding:4px 12px;}
.bsair{padding:0.4rem 1rem;background:transparent;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);border-radius:8px;font-size:0.77rem;cursor:pointer;font-family:'Outfit',sans-serif;}
.bback{padding:0.4rem 1rem;background:transparent;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);border-radius:8px;font-size:0.77rem;text-decoration:none;display:inline-block;}

.tabs{background:var(--card);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;overflow-x:auto;}
.tab{padding:1rem 1.2rem;font-size:0.82rem;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;font-family:'Outfit',sans-serif;transition:all 0.18s;}
.tab.active{color:var(--plum);border-bottom-color:var(--violet);}
.badge{display:inline-block;background:var(--gold);color:#fff;font-size:0.65rem;padding:1px 6px;border-radius:999px;margin-left:5px;}

.content{max-width:1100px;margin:0 auto;padding:2rem 1.5rem;}
.section-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--plum);margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.btn-refresh{padding:0.4rem 1rem;background:var(--plum);color:#fff;border:none;border-radius:8px;font-family:'Outfit',sans-serif;font-size:0.78rem;cursor:pointer;}
.btn-export{padding:0.4rem 1rem;background:var(--ink);color:#fff;border:none;border-radius:8px;font-family:'Outfit',sans-serif;font-size:0.78rem;cursor:pointer;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.3rem;display:flex;flex-direction:column;gap:0.7rem;position:relative;overflow:hidden;}
.card.pendente{border-left:4px solid var(--gold);}
.card.aprovado{border-left:4px solid var(--sage);}
.card.reprovado{border-left:4px solid #c0392b;opacity:0.7;}

.card-name{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;color:var(--plum);}
.card-info{font-size:0.78rem;color:var(--muted);line-height:1.8;}
.card-info span{display:block;}
.card-status{font-size:0.68rem;font-weight:600;padding:3px 10px;border-radius:999px;align-self:flex-start;}
.st-pendente{background:#FEF3E8;color:#B85C1A;}
.st-aprovado{background:#E3F4ED;color:#3D7A5E;}
.st-reprovado{background:#FCE8E8;color:#c0392b;}

.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;}
.btn-aprovar{flex:1;padding:0.5rem;background:var(--sage);color:#fff;border:none;border-radius:8px;font-size:0.77rem;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:500;}
.btn-reprovar{flex:1;padding:0.5rem;background:#c0392b;color:#fff;border:none;border-radius:8px;font-size:0.77rem;cursor:pointer;font-family:'Outfit',sans-serif;font-weight:500;}
.btn-premium{padding:0.5rem;background:var(--gold);color:#fff;border:none;border-radius:8px;font-size:0.77rem;cursor:pointer;font-family:'Outfit',sans-serif;}
.btn-ver{padding:0.5rem 0.8rem;background:var(--plum);color:#fff;border:none;border-radius:8px;font-size:0.77rem;cursor:pointer;font-family:'Outfit',sans-serif;text-decoration:none;display:inline-block;text-align:center;}
.btn-del{padding:0.5rem;background:transparent;color:#ccc;border:1px solid var(--border);border-radius:8px;font-size:0.77rem;cursor:pointer;}
.btn-del:hover{color:#c0392b;border-color:#c0392b;}

.empty{text-align:center;padding:3rem;color:var(--muted);}
.loading{text-align:center;padding:2rem;color:var(--muted);}
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--plum);color:#fff;padding:0.8rem 1.4rem;border-radius:12px;font-size:0.85rem;z-index:999;box-shadow:0 8px 24px rgba(15,13,26,0.3);}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;margin-bottom:2rem;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.2rem;text-align:center;}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:2.5rem;font-weight:700;color:var(--plum);line-height:1;}
.stat-label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px;}
.stat-card.gold{border-color:var(--gold);}
.stat-card.gold .stat-num{color:var(--gold);}

/* MODAL */
#modal{display:none;position:fixed;inset:0;background:rgba(15,13,26,0.6);z-index:200;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(4px);}
#modal.open{display:flex;}
.modal-box{background:var(--card);border-radius:18px;padding:1.8rem;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
.modal-box h3{font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--plum);margin-bottom:1.2rem;}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-grid label{font-size:0.72rem;color:var(--muted);display:block;margin-bottom:3px;}
.modal-grid input,.modal-grid select,.modal-grid textarea{width:100%;padding:0.55rem 0.8rem;border:1.5px solid var(--border);border-radius:8px;font-family:'Outfit',sans-serif;font-size:0.82rem;color:var(--ink);background:var(--cream);outline:none;}
.modal-grid input:focus,.modal-grid select:focus{border-color:var(--violet);}
.mfull{grid-column:span 2;}
.modal-actions{display:flex;gap:8px;margin-top:1.2rem;}
.btn-save{flex:1;padding:0.65rem;background:var(--plum);color:#fff;border:none;border-radius:9px;font-family:'Outfit',sans-serif;font-size:0.88rem;cursor:pointer;}
.btn-cancel{padding:0.65rem 1rem;background:transparent;border:1.5px solid var(--border);border-radius:9px;font-family:'Outfit',sans-serif;font-size:0.88rem;cursor:pointer;color:var(--muted);}

@media(max-width:500px){.modal-grid{grid-template-columns:1fr;}.mfull{grid-column:span 1;}.content{padding:1.5rem 1rem;}}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <div class="lbrand">Conexão <em>Psi</em></div>
    <div class="ltag">Painel Administrativo</div>
    <div class="lcard">
      <h2>Acesso Restrito</h2>
      <p>Exclusivo para administradores da plataforma</p>
      <input type="password" class="linput" id="senha" placeholder="Senha admin" onkeydown="if(event.key==='Enter')entrar()">
      <button class="lblogin" onclick="entrar()">Entrar →</button>
      <div class="lerr" id="lerr"></div>
    </div>
  </div>
</div>

<div id="app">
  <header class="header">
    <div>
      <div class="hbrand">Conexão <em>Psi</em></div>
      <div class="htag">Painel Admin</div>
    </div>
    <div style="display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;">
      <span class="chip">⚙️ Admin</span>
      <a href="index.html" class="bback">← Site</a>
      <button class="bsair" onclick="sair()">Sair</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="mudarAba('pendentes',this)">⏳ Pendentes <span class="badge" id="n-pend">0</span></button>
    <button class="tab" onclick="mudarAba('aprovados',this)">✅ Aprovados <span class="badge" id="n-aprov" style="background:var(--sage)">0</span></button>
    <button class="tab" onclick="mudarAba('premium',this)">✨ Premium <span class="badge" id="n-prem" style="background:var(--gold)">0</span></button>
    <button class="tab" onclick="mudarAba('todos',this)">📋 Todos</button>
  </div>

  <div class="content">
    <!-- STATS -->
    <div class="stats" id="stats"></div>
    <!-- ACTIONS -->
    <div class="section-title">
      <span id="section-label">Psicólogos Pendentes</span>
      <div style="display:flex;gap:8px;">
        <button class="btn-refresh" onclick="carregar()">🔄 Atualizar</button>
        <button class="btn-export" onclick="exportar()">📥 CSV</button>
      </div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none;">Nenhum registro aqui.</div>
    <div id="loading" class="loading">Carregando...</div>
  </div>
</div>

<!-- MODAL EDITAR -->
<div id="modal">
  <div class="modal-box">
    <h3>✏️ Editar Psicóloga</h3>
    <div class="modal-grid">
      <div class="mfull"><label>Nome</label><input id="e-nome"></div>
      <div><label>CRP</label><input id="e-crp"></div>
      <div><label>Instagram</label><input id="e-handle" placeholder="sem @"></div>
      <div><label>Abordagem</label><input id="e-abordagem"></div>
      <div><label>Formato</label>
        <select id="e-formato"><option>Online</option><option>Presencial</option><option>Ambos</option></select>
      </div>
      <div class="mfull"><label>Cidade/Estado</label><input id="e-cidade"></div>
      <div class="mfull"><label>Público Atendido</label><input id="e-publico"></div>
      <div class="mfull"><label>Email</label><input id="e-email" type="email"></div>
      <div><label>WhatsApp</label><input id="e-whatsapp" placeholder="só números"></div>
      <div><label>Valor da Sessão</label><input id="e-valor"></div>
      <div class="mfull"><label>Especialidades</label><input id="e-especialidades" placeholder="separadas por vírgula"></div>
      <div class="mfull"><label>Mini Bio (Premium)</label><textarea id="e-bio" style="min-height:60px;"></textarea></div>
      <div><label>Status</label>
        <select id="e-status">
          <option value="pendente">Pendente</option>
          <option value="aprovado">Aprovado</option>
          <option value="reprovado">Reprovado</option>
        </select>
      </div>
      <div><label>Premium</label>
        <select id="e-premium">
          <option value="false">Não</option>
          <option value="true">Sim ✨</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-save" onclick="salvarEd()">Salvar</button>
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>
const SB = 'https://tjtrdfbckgdgvcegdsbz.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqdHJkZmJja2dkZ3ZjZWdkc2J6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyODM1ODcsImV4cCI6MjA4OTg1OTU4N30.zNHugdW2a2hYrY43hdqS8TkSM9uCYognU_UyzJZ2Los';
const PASS = 'conexaopsi2026';
const H = {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'};

let aba = 'pendentes', todos = [], editId = null;

async function api(method, path, body) {
  const r = await fetch(SB+'/rest/v1/'+path, {method, headers:H, body: body ? JSON.stringify(body) : undefined});
  const text = await r.text();
  if (!r.ok) throw new Error(text);
  return text ? JSON.parse(text) : null;
}

function entrar() {
  if (document.getElementById('senha').value.trim() === PASS) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    carregar();
  } else {
    document.getElementById('lerr').textContent = 'Senha incorreta.';
  }
}
function sair() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('senha').value = '';
}

function mudarAba(a, btn) {
  aba = a;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const labels = {pendentes:'Psicólogos Pendentes', aprovados:'Psicólogos Aprovados', premium:'Perfis Premium', todos:'Todos os Psicólogos'};
  document.getElementById('section-label').textContent = labels[a];
  render();
}

async function carregar() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('grid').innerHTML = '';
  document.getElementById('empty').style.display = 'none';
  try {
    todos = await api('GET', 'psis?select=*&order=created_at.desc&limit=500') || [];
    atualizarStats();
    render();
  } catch(e) {
    document.getElementById('loading').textContent = 'Erro: ' + e.message;
  }
  document.getElementById('loading').style.display = 'none';
}

function atualizarStats() {
  const pend = todos.filter(p => p.status === 'pendente').length;
  const aprov = todos.filter(p => p.status === 'aprovado').length;
  const prem = todos.filter(p => p.premium === true).length;
  const reprov = todos.filter(p => p.status === 'reprovado').length;
  document.getElementById('n-pend').textContent = pend;
  document.getElementById('n-aprov').textContent = aprov;
  document.getElementById('n-prem').textContent = prem;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-num">${todos.length}</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--gold)">${pend}</div><div class="stat-label">Pendentes</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--sage)">${aprov}</div><div class="stat-label">Aprovados</div></div>
    <div class="stat-card gold"><div class="stat-num">${prem}</div><div class="stat-label">Premium ✨</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#c0392b">${reprov}</div><div class="stat-label">Reprovados</div></div>
  `;
}

function render() {
  const filtros = {
    pendentes: p => p.status === 'pendente',
    aprovados: p => p.status === 'aprovado',
    premium: p => p.premium === true,
    todos: () => true
  };
  const lista = todos.filter(filtros[aba]);
  const g = document.getElementById('grid'), e = document.getElementById('empty');
  if (!lista.length) { g.innerHTML = ''; e.style.display = 'block'; return; }
  e.style.display = 'none';
  g.innerHTML = lista.map(p => {
    const stClass = `st-${p.status}`;
    const stLabel = {pendente:'⏳ Pendente', aprovado:'✅ Aprovado', reprovado:'❌ Reprovado'}[p.status] || p.status;
    const h = (p.handle||'').replace('@','');
    return `<div class="card ${p.status}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div class="card-name">${p.nome||'—'}</div>
        <span class="card-status ${stClass}">${stLabel}</span>
      </div>
      <div class="card-info">
        <span>📋 ${p.crp||'—'}</span>
        <span>📷 @${h||'—'}</span>
        <span>🧠 ${p.abordagem||'—'} · ${p.formato||'—'}</span>
        <span>📍 ${p.cidade||'—'}</span>
        <span>✉️ ${p.email||'—'}</span>
        ${p.premium ? '<span style="color:var(--gold);font-weight:600;">✨ Premium</span>' : ''}
      </div>
      <div class="card-actions">
        ${p.status === 'pendente' ? `
          <button class="btn-aprovar" onclick="aprovar('${p.id}')">✅ Aprovar</button>
          <button class="btn-reprovar" onclick="reprovar('${p.id}')">❌ Reprovar</button>
        ` : ''}
        ${p.status === 'aprovado' && !p.premium ? `<button class="btn-premium" onclick="ativarPremium('${p.id}')">✨ Premium</button>` : ''}
        ${p.status === 'aprovado' && p.premium ? `<button class="btn-premium" style="background:var(--muted)" onclick="desativarPremium('${p.id}')">Remover Premium</button>` : ''}
        <button class="btn-ver" onclick="abrirEd('${p.id}')">✏️</button>
        <button class="btn-del" onclick="excluir('${p.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

async function aprovar(id) {
  try {
    await api('PATCH', `psis?id=eq.${id}`, {status:'aprovado'});
    const p = todos.find(x => x.id === id);
    if (p) p.status = 'aprovado';
    atualizarStats(); render();
    toast('✅ Psicóloga aprovada!');
  } catch(e) { alert('Erro: '+e.message); }
}

async function reprovar(id) {
  if (!confirm('Reprovar esta psicóloga?')) return;
  try {
    await api('PATCH', `psis?id=eq.${id}`, {status:'reprovado'});
    const p = todos.find(x => x.id === id);
    if (p) p.status = 'reprovado';
    atualizarStats(); render();
    toast('❌ Psicóloga reprovada.');
  } catch(e) { alert('Erro: '+e.message); }
}

async function ativarPremium(id) {
  try {
    await api('PATCH', `psis?id=eq.${id}`, {premium:true});
    const p = todos.find(x => x.id === id);
    if (p) p.premium = true;
    atualizarStats(); render();
    toast('✨ Premium ativado!');
  } catch(e) { alert('Erro: '+e.message); }
}

async function desativarPremium(id) {
  if (!confirm('Remover premium?')) return;
  try {
    await api('PATCH', `psis?id=eq.${id}`, {premium:false});
    const p = todos.find(x => x.id === id);
    if (p) p.premium = false;
    atualizarStats(); render();
    toast('Premium removido.');
  } catch(e) { alert('Erro: '+e.message); }
}

async function excluir(id) {
  if (!confirm('Excluir permanentemente?')) return;
  try {
    await api('DELETE', `psis?id=eq.${id}`);
    todos = todos.filter(x => x.id !== id);
    atualizarStats(); render();
    toast('Registro excluído.');
  } catch(e) { alert('Erro: '+e.message); }
}

function abrirEd(id) {
  const p = todos.find(x => x.id === id);
  if (!p) return;
  editId = id;
  document.getElementById('e-nome').value = p.nome||'';
  document.getElementById('e-crp').value = p.crp||'';
  document.getElementById('e-handle').value = (p.handle||'').replace('@','');
  document.getElementById('e-abordagem').value = p.abordagem||'';
  document.getElementById('e-formato').value = p.formato||'Online';
  document.getElementById('e-cidade').value = p.cidade||'';
  document.getElementById('e-publico').value = p.publico||'';
  document.getElementById('e-email').value = p.email||'';
  document.getElementById('e-whatsapp').value = p.whatsapp||'';
  document.getElementById('e-valor').value = p.valor_sessao||'';
  document.getElementById('e-especialidades').value = p.especialidades||'';
  document.getElementById('e-bio').value = p.bio||'';
  document.getElementById('e-status').value = p.status||'pendente';
  document.getElementById('e-premium').value = p.premium ? 'true' : 'false';
  document.getElementById('modal').classList.add('open');
}

function fecharModal() {
  document.getElementById('modal').classList.remove('open');
  editId = null;
}

async function salvarEd() {
  if (!editId) return;
  const updates = {
    nome: document.getElementById('e-nome').value.trim(),
    crp: document.getElementById('e-crp').value.trim(),
    handle: document.getElementById('e-handle').value.trim().replace('@',''),
    abordagem: document.getElementById('e-abordagem').value.trim(),
    formato: document.getElementById('e-formato').value,
    cidade: document.getElementById('e-cidade').value.trim(),
    publico: document.getElementById('e-publico').value.trim(),
    email: document.getElementById('e-email').value.trim(),
    whatsapp: document.getElementById('e-whatsapp').value.trim().replace(/\D/g,''),
    valor_sessao: document.getElementById('e-valor').value.trim(),
    especialidades: document.getElementById('e-especialidades').value.trim(),
    bio: document.getElementById('e-bio').value.trim(),
    status: document.getElementById('e-status').value,
    premium: document.getElementById('e-premium').value === 'true'
  };
  try {
    await api('PATCH', `psis?id=eq.${editId}`, updates);
    const p = todos.find(x => x.id === editId);
    if (p) Object.assign(p, updates);
    fecharModal();
    atualizarStats(); render();
    toast('✅ Salvo com sucesso!');
  } catch(e) { alert('Erro: '+e.message); }
}

function exportar() {
  const lista = todos;
  const cols = ['nome','email','crp','handle','abordagem','formato','cidade','publico','status','premium'];
  const rows = lista.map(p => cols.map(c => `"${(p[c]||'').toString().replace(/"/g,'""')}"`).join(','));
  const csv = '\uFEFF' + [cols.join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
  a.download = 'conexao-psi-psis.csv';
  a.click();
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) fecharModal();
});
</script>
</body>
